
name: Facebook Content Autopilot

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Post slot (1-5)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      publish:
        description: "Publish to Facebook"
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "30 2 * * *"
    - cron: "30 5 * * *"
    - cron: "30 8 * * *"
    - cron: "30 11 * * *"
    - cron: "30 14 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and publish Facebook post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: "v27.0"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)

            case "$HOUR" in
              02) SLOT=1 ;;
              05) SLOT=2 ;;
              08) SLOT=3 ;;
              11) SLOT=4 ;;
              14) SLOT=5 ;;
              *) echo "Unknown schedule hour"; exit 1 ;;
            esac

            echo "Scheduled Facebook publishing: slot $SLOT"
            python main.py --slot "$SLOT"

          elif [ "${{ inputs.publish }}" = "true" ]; then
            python main.py --slot "${{ inputs.slot }}"

          else
            python main.py --slot "${{ inputs.slot }}" --dry-run
          fi

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: facebook-generated-image
          path: output/
          if-no-files-found: warn
